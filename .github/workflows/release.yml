name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.2 - CCC 统一管理与帧动画细调'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.2 将 CCC 的分组连接收进一个统一入口，选择模型即可自动使用所属分组的 Key。帧动画新增自定义动作、半像素偏移与前帧辅助预览，并修复文档改名、RunningHub 参考图和分集对话压缩的问题。

            ## 🔌 CCC 与模型调用

            - 设置列表只显示一张「CCC API」卡片，在内部同时管理各分组的 Key、模型与选择；各组分别保留配置，一次保存，无需反复切换和输入 Key。
            - 节点与对话的模型菜单统一显示 CCC API，模型保留所属分组标签，调用自动匹配对应连接的 Key。复制和删除移到各组内部，复制不含 Key；已删除的连接不会被保存全部重新恢复。
            - 修复 RunningHub 普通参考图误触发首帧校验；按同系列已登记的参考或文生操作调用，显式首尾帧仍按对应规则检查。

            ## 🎬 帧动画与画布

            - 帧动画支持自定义动作描述、0.5 像素步进偏移、对齐辅助线及前帧叠加预览，方便检查运动衔接与角色位置。
            - 去背景、切帧和对齐后的透明精灵图可复用项目缓存，节点优先使用处理后的预览，减少重复处理；源文件或参数变化、缓存损坏时重新生成。
            - 内置生成特效与画布共用渲染实现，减少不必要的光晕、指针和重复计算；调整人物三视图布局及生成动效加载。

            ## 🗂 资源与对话

            - 资源库文档支持改名并保留原扩展名，文本预览窗口避让 macOS 系统窗口按钮。
            - 分集对话压缩使用当前分集的文本模型；摘要被截断、出错或返回工具调用时保留原上下文，便于更换模型后继续。
            - 补充多处界面的英文文案，并更新资源库、资产详情及帧动画编辑的使用说明。

            ## ⚠️ 升级与兼容性

            - IndexedDB schema 保持 v22。CCC 沿用已有独立连接及凭据存储，无需迁移数据或重新填写已保存的 Key；同名模型仍按各自分组区分。
            - 新增模型仍需自行启用并配置对应厂商 Key。RunningHub、AutoDL、Blender 及 ComfyUI 模板需具备对应服务或运行环境；真实厂商生成、跨平台安装和实际导出仍以各自环境验收为准。
            - AI 应用首版仍不支持写入其他画布节点或编排模型和文件操作；Windows/Linux 原生界面与真实外部 MCP 联调仍待补充。已有插件必须具备有效的源码和 revision 摘要及完整原生私有快照，缺失时需要重新安装。
            - Windows 不支持 AVX/AVX2 的旧款 CPU 请使用 Legacy 安装包；Legacy 不包含本地 ONNX 和自动更新。本地语音转文本依赖桌面 ONNX，Intel Mac 同样不包含此功能。
            - 视频剪辑导出编码取决于本机编解码器。原生窗口、应用内 ComfyUI、MCP 控制桥、本地文件导出与方舟 SQLite 用量账本仅在桌面版可用；浏览器模式的 API Key 仅在当前会话有效。
            - macOS 安装包使用临时签名，未经过 Apple 公证；首次打开若被拦截，可在「系统设置 → 隐私与安全性」允许，更多处理方式见[首次打开说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：Apple Silicon 使用 `aarch64.dmg`，Intel 使用 `x64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
